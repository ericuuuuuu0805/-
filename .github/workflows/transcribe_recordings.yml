name: 録音ファイル文字起こし

on:
  workflow_dispatch:         # 手動実行
  schedule:
    - cron: '0 0 * * *'     # 毎日 09:00 JST (UTC 00:00)

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Transcribe recordings
        run: python scripts/transcribe_from_gdrive.py
        env:
          GDRIVE_TOKEN_JSON:                ${{ secrets.GDRIVE_TOKEN_JSON }}
          GDRIVE_AUDIO_FOLDER_ID:           ${{ secrets.GDRIVE_AUDIO_FOLDER_ID }}
          OPENAI_API_KEY:                   ${{ secrets.OPENAI_API_KEY }}
          NOTION_TOKEN:                     ${{ secrets.NOTION_TOKEN }}
          NOTION_TRANSCRIPTION_DATABASE_ID: ${{ secrets.NOTION_TRANSCRIPTION_DATABASE_ID }}
