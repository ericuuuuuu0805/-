name: 週次 全社目合わせダイジェスト

on:
  schedule:
    - cron: '0 0 * * 1'  # 毎週月曜日 9:00 JST (UTC+9 → UTC 00:00)
  workflow_dispatch:      # 手動実行も可能

jobs:
  alignment-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Extract issues and decisions from Slack
        run: python scripts/extract_from_slack.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN:      ${{ secrets.NOTION_TOKEN }}
          SLACK_BOT_TOKEN:   ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Run alignment digest
        run: python scripts/alignment_digest.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN:      ${{ secrets.NOTION_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
